[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "miros"
version = "4.3.0"
description = "A statechart library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Python Software Foundation License" }
authors = [{ name = "Scott Volk", email = "scottvolk@gmail.com" }]
keywords = [
    "hsm",
    "HSM",
    "statechart",
    "hierarchical state machine",
    "statemachine",
    "miros",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Python Software Foundation License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aleph2c/miros"

[tool.setuptools]
packages = ["miros"]

[tool.setuptools.package-data]
miros = ["py.typed"]

[tool.pyright]
# The miros package is fully annotated and type-checks cleanly under strict mode.
# Scope strict checking to the package itself (the examples/ and test/ trees are
# intentionally untyped demos/specs).
include = ["miros"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
